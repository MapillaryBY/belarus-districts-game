        body {

        #map {

        #game-panel {
            position: absolute;
            top: 12px;
            left: 50%;

            z-index: 1000;

            padding: 10px 18px;

            margin-top: 6px;
            font-size: 14px;
        }

        .win {
            color: #27ae60;
            font-weight: bold;
        }

        .lose {
            color: #c0392b;
            font-weight: bold;
        }

        #restart-btn {
            display: none;
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            background: #2c3e50;
            color: white;
            cursor: pointer;
        }

            #restart-btn:hover {
                background: #1a252f;
            }

        .region-tooltip {
            background: rgba(0,0,0,0.75);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            padding: 4px 8px;
        }

            .region-tooltip::before {
                display: none;
            }

        #wiki-info {
            margin-top: 8px;
            font-size: 12px;
            color: #444;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            display: none;
        }

        var MODE_KEY = 'belarus_rayons_mode';
        var currentMode = localStorage.getItem(MODE_KEY) || 'test';

        // ===== КЛЮЧЕВОЕ ИЗМЕНЕНИЕ: универсальное получение имени =====
        // Overpass Turbo экспортирует теги OSM в properties.name (или name:ru/name:be).
        // Эта функция вытаскивает имя независимо от источника данных.
        // Уникальный ключ района — поле name (не зависит от языка интерфейса)
        function getRegionKey(feature) {
            if (!feature || !feature.properties) return null;
            return feature.properties.name || null;
        }

        // Отображаемое имя — name:ru или name:be в зависимости от языка, с fallback на name
        function getRegionName(feature) {
            if (!feature || !feature.properties) return null;
            var p = feature.properties;
            var lang = getLang();
            if (lang === 'be' && p['name:be']) return p['name:be'];
            if (lang === 'ru' && p['name:ru']) return p['name:ru'];
            return p.name || null;
        }

        // Для отображения в интерфейсе используем то же имя
        function regionDisplayName(regionName) {
            return regionName || 'Неизвестный район';
        }

        function applyMode() {
            var isDemo = currentMode === 'demo';
            document.getElementById('modetest').style.fontWeight = isDemo ? 'normal' : 'bold';
            document.getElementById('modedemo').style.fontWeight = isDemo ? 'bold' : 'normal';
            document.getElementById('prompt-text').textContent = isDemo ? t('demoHint') : t('prompt');
            document.getElementById('target-region').style.display = isDemo ? 'none' : 'block';
            document.getElementById('score').style.display = isDemo ? 'none' : 'block';
            document.getElementById('restart-btn').style.display = 'none';
            showBtn.style.display = isDemo ? 'none' : 'inline-block';

            messageDisplay.textContent = '';
            messageDisplay.className = '';
            wikiInfo.style.display = 'none';
            wikiInfo.textContent = '';

            if (geoLayer) {
                geoLayer.eachLayer(function (l) {
                    if (typeof l.setStyle === 'function') {
                        l.setStyle({ color: '#ffffff', weight: 1, fillOpacity: 0 });
                    }
                    if (isDemo && l.feature) {
                        l.unbindTooltip && l.unbindTooltip();
                        l.bindTooltip(regionDisplayName(getRegionName(l.feature)), {
                            permanent: false,
                            direction: 'center',
                            className: 'region-tooltip'
                        });
                    } else {
                        l.unbindTooltip && l.unbindTooltip();
                    }
                });
            }

            if (!isDemo) {
                resetGame();
            } else {
                gameOver = true;
            }
        }

        // WIKI_NAME_MAP больше не нужен для отображения (имена берутся из данных),
        // но оставлен для загрузки Википедии, если вы захотите её вернуть.
        var WIKI_NAME_MAP = {};

        function loadWikiInfo(regionName) {
            wikiInfo.style.display = 'none';
            wikiInfo.textContent = '';
            // Временно отключено, так как для новых данных нужен другой маппинг.
            // Если захотите вернуть Википедию, нужно будет сопоставить name из OSM
            // с названием статьи в Википедии.
        }

        function applyLanguage() {
            document.title = t('title');
            document.getElementById('prompt-text').textContent = t('prompt');
            document.getElementById('restart-btn').textContent = t('restart');
            document.getElementById('modetest').textContent = t('modeTest');
            document.getElementById('modedemo').textContent = t('modeDemo');
            showBtn.textContent = t('show');
            updateScore();
            if (messageDisplay && messageDisplay.dataset.key) {
                messageDisplay.textContent = t(messageDisplay.dataset.key);
            }
            if (currentTargetFeature && currentMode === 'test' && !gameOver) {
                targetDisplay.textContent = regionDisplayName(getRegionName(currentTargetFeature));
            }
            if (typeof applyMode === 'function' && currentMode === 'demo') {
                applyMode();
            }
        }

        function loadStats() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        }

        function saveStats(stats) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
            } catch (e) {
                console.warn('Не удалось сохранить статистику', e);
            }
        }

        function updateScore() {
            var stats = loadStats();
            var total = 0, guessed = 0, wrong = 0;
            for (var k in stats) {
                if (!stats[k] || !stats[k].lastAsked) continue;
                total++;
                if (stats[k].guessed) guessed++;
                else wrong++;
            }
            scoreDisplay.textContent = t('scoreGuessed') + guessed + '  | ' + t('scoreWrong') + wrong + '  | ' + t('scoreTotal') + total;
        }

        // ===== Сбор имён из данных =====
        function getAllRegionNames() {
            var items = [];
            geoLayer.eachLayer(function (l) {
                var key = getRegionKey(l.feature);
                if (key) items.push({ key: key, feature: l.feature });
            });
            return items;
        }

        function pickNextRegion() {
            var stats = loadStats();
            var all = getAllRegionNames();

            var neverAsked = all.filter(function (item) {
                return !stats[item.key] || !stats[item.key].lastAsked;
            });
            if (neverAsked.length > 0) {
                return neverAsked[Math.floor(Math.random() * neverAsked.length)];
            }

            var wrongOnes = all.filter(function (item) {
                return stats[item.key] && stats[item.key].lastAsked && !stats[item.key].guessed;
            });
            if (wrongOnes.length > 0) {
                return wrongOnes[Math.floor(Math.random() * wrongOnes.length)];
            }

            return null;
        }

        function resetGame() {
            if (currentMode === 'demo') {
                applyMode();
                return;
            }
            gameOver = false;
            messageDisplay.textContent = '';
            messageDisplay.className = '';
            restartBtn.style.display = 'none';
            showBtn.style.display = 'inline-block';
            wikiInfo.style.display = 'none';
            wikiInfo.textContent = '';

            geoLayer.eachLayer(function (l) {
                if (typeof l.setStyle === 'function') {
                    l.setStyle({ color: '#ffffff', weight: 1, fillOpacity: 0 });
                }
            });

            var next = pickNextRegion();

            if (next === null) {
                targetDisplay.textContent = t('allDone');
                messageDisplay.textContent = t('resetMsg');
                messageDisplay.className = 'win';
                localStorage.removeItem(STORAGE_KEY);
                updateScore();
                setTimeout(function () { resetGame(); }, 1500);
                return;
            }
            currentTarget = next.key;
            currentTargetFeature = next.feature;
            targetDisplay.textContent = regionDisplayName(getRegionName(currentTargetFeature));
            updateScore();
        }

        geoLayer = L.geoJSON(data, {
            style: function (feature) {
                return { color: '#ffffff', weight: 1, fillOpacity: 0 };
            },
            onEachFeature: function (feature, layer) {
                layer.on('click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    if (currentMode === 'demo') return;
                    if (gameOver) return;
                    var clickedKey = getRegionKey(feature);
                    var stats = loadStats();
                    showBtn.style.display = 'none';

                    if (clickedKey === currentTarget) {
                        messageDisplay.textContent = t('win');
                        messageDisplay.className = 'win';
                        gameOver = true;
                        loadWikiInfo(currentTarget);
                        layer.setStyle({ color: '#27ae60', weight: 3, fillColor: '#27ae60', fillOpacity: 0.25 });

                        if (!stats[currentTarget]) stats[currentTarget] = { guessed: false, lastAsked: null };
                        stats[currentTarget].guessed = true;
                        stats[currentTarget].lastAsked = new Date().toISOString();
                        saveStats(stats);

                        updateScore();
                        restartBtn.style.display = 'inline-block';
                    } else {
                        messageDisplay.textContent = t('lose') + regionDisplayName(getRegionName(feature));
                        messageDisplay.className = 'lose';
                        gameOver = true;
                        loadWikiInfo(currentTarget);
                        layer.setStyle({ color: '#e74c3c', weight: 3, fillColor: '#e74c3c', fillOpacity: 0.25 });

                        if (!stats[currentTarget]) stats[currentTarget] = { guessed: false, lastAsked: null };
                        stats[currentTarget].guessed = false;
                        stats[currentTarget].lastAsked = new Date().toISOString();
                        saveStats(stats);

                        geoLayer.eachLayer(function (l) {
                            if (getRegionKey(l.feature) === currentTarget && typeof l.setStyle === 'function') {
                                l.setStyle({ color: '#27ae60', weight: 3, fillColor: '#27ae60', fillOpacity: 0.25 });
                            }
                        });

                        updateScore();
                        restartBtn.style.display = 'inline-block';
                    }
                });
            }
        }).addTo(map);

        // Слой райцентров (точки) — только для отображения, без setStyle
        var centersLayer = L.geoJSON(centersData, {
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, { radius: 3, color: '#ffcc00', fillOpacity: 0.8 });
            }
        }).addTo(map);

        restartBtn.addEventListener('click', resetGame);

        showBtn.addEventListener('click', function () {
            if (gameOver || !currentTarget) return;
            gameOver = true;

            // Подсветить загаданный район
            geoLayer.eachLayer(function (l) {
                if (getRegionKey(l.feature) === currentTarget && typeof l.setStyle === 'function') {
                    l.setStyle({ color: '#27ae60', weight: 3, fillColor: '#27ae60', fillOpacity: 0.25 });
                }
            });

            // Сообщение
            messageDisplay.textContent = t('revealMsg') + regionDisplayName(getRegionName(currentTargetFeature)) + '?';
            messageDisplay.className = 'lose';

            // Записать в статистику как не угаданный
            var stats = loadStats();
            if (!stats[currentTarget]) stats[currentTarget] = { guessed: false, lastAsked: null };
            stats[currentTarget].guessed = false;
            stats[currentTarget].lastAsked = new Date().toISOString();
            saveStats(stats);

            loadWikiInfo(currentTarget);
            updateScore();

            showBtn.style.display = 'none';
            restartBtn.style.display = 'inline-block';
        });

        document.getElementById('modetest').addEventListener('click', function (e) {
            e.preventDefault();
            currentMode = 'test';
            localStorage.setItem(MODE_KEY, currentMode);
            applyMode();
        });

        document.getElementById('modedemo').addEventListener('click', function (e) {
            e.preventDefault();
            currentMode = 'demo';
            localStorage.setItem(MODE_KEY, currentMode);
            applyMode();
        });

        document.getElementById('lang-ru').addEventListener('click', function (e) {
            e.preventDefault();
            localStorage.setItem(LANG_KEY, 'ru');
            applyLanguage();
        });

        document.getElementById('lang-be').addEventListener('click', function (e) {
            e.preventDefault();
            localStorage.setItem(LANG_KEY, 'be');
            applyLanguage();
        });

        applyLanguage();
        applyMode();
    </script>
</body>
</html>
